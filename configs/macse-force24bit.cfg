# Mac Memory Project: current macse base + fresh 24-bit address-mask option
# The ROM image is intentionally not included in this repository.

cpu 68030
platform macse
force24bit 1

map type=rom address=0x400000 size=1M file=macse.rom id=sysrom
map type=wtcram address=0x000000 size=4M id=sysram

loopcycles 300

# Preserve the verified physical-write limiting policy from macse-warpspeed.
# Add only the ranges appropriate to the installed SE hardware.
# physwrite address=0x3F2700 size=0x5580
# physwrite address=0x3FA100 size=740
# physwrite address=0x3FA700 size=0x5580
# physwrite address=0x3FFD00 size=740
